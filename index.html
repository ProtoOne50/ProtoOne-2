<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><title>PROTOONE 2.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f5f2;background:#0c0f13}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:540px;margin:auto;min-height:100vh;padding:24px 19px 105px;background:radial-gradient(ellipse at 95% -10%,#243442 0,transparent 40%),#0c0f13}.brand{font-size:12px;letter-spacing:.23em;font-weight:800;color:#b8c4c8}.top{display:flex;justify-content:space-between;align-items:center}.mark{height:36px;width:36px;border:1px solid #566b6b;border-radius:11px;display:grid;place-items:center;color:#b8f1bd;font-weight:900}h1{font-size:34px;line-height:1.08;margin:27px 0 8px;letter-spacing:-.05em}h2{font-size:23px;letter-spacing:-.035em;margin:0 0 14px}p{color:#a6adb5;line-height:1.5;margin:0 0 16px}.muted{color:#a6adb5}.small{font-size:12px}.label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a3b3b7;font-weight:750}.hero{border:1px solid #343d44;background:linear-gradient(145deg,#253b41,#141b23 60%,#182620);border-radius:23px;padding:20px;margin:20px 0;min-height:185px;position:relative;overflow:hidden}.hero:after{content:'P / 1';position:absolute;right:-12px;bottom:-30px;font-size:130px;font-weight:900;color:#ffffff08;letter-spacing:-.12em}.hero h2{margin-top:15px;font-size:28px;position:relative;z-index:1}.hero p{max-width:300px;position:relative;z-index:1}.tag{display:inline-block;background:#b5f0c7;color:#10221b;border-radius:100px;padding:6px 11px;font-size:11px;font-weight:850;letter-spacing:.04em}.panel{border:1px solid #30383f;border-radius:19px;padding:16px;background:#171c22;margin:14px 0}.section{margin-top:25px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.seg.four{grid-template-columns:repeat(4,1fr)}.seg button{background:#242b31;border:1px solid #39434a;border-radius:11px;color:#c9d0d4;padding:12px 5px;font-size:12px}.seg button.active{border-color:#b5f0c7;background:#274036;color:#d7ffe4}.primary{width:100%;border:0;border-radius:14px;background:#b5f0c7;color:#0b2116;padding:15px;font-weight:850;margin-top:12px}.secondary{background:#262e35;color:#f3f5f4;border:1px solid #475159;padding:11px 13px;border-radius:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1b2329;padding:12px;border-radius:12px}.stat strong{display:block;font-size:20px;margin-top:6px}.nav{position:fixed;bottom:0;left:0;right:0;background:#10161bf2;border-top:1px solid #30383f;display:flex;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:20}.navinner{width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;color:#88969b;font-size:11px;padding:7px 0}.nav button.active{color:#b5f0c7}.nav b{display:block;font-size:19px;margin-bottom:3px}.exercise{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #303840}.exercise:last-child{border:0}.visual{height:75px;width:83px;flex:0 0 83px;border-radius:12px;overflow:hidden;background:linear-gradient(140deg,#36515c,#1a2d33);display:grid;place-items:center}.visual svg{height:70px;width:70px}.exercise .info{flex:1}.exercise .info strong{display:block;font-size:14px}.exercise .info span{font-size:12px;color:#aab6bc}.pill{font-size:10px;border:1px solid #536268;border-radius:20px;padding:4px 7px;color:#cbd7db}.set{display:grid;grid-template-columns:26px 1fr 1fr 55px;align-items:center;gap:9px;margin:9px 0}.set input{width:100%;min-width:0;background:#0e1419;color:white;border:1px solid #3b474d;border-radius:9px;padding:11px 8px;text-align:center}.set button{background:#28323a;border:1px solid #4b585d;color:white;border-radius:9px;height:40px}.set button.done{background:#b5f0c7;color:#092116}.exercise-title{font-size:20px;margin:8px 0}.help{padding:11px 13px;background:#223038;border-radius:12px;color:#c5d2d4;font-size:13px;line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.empty{text-align:center;padding:24px;color:#a9b4b8}.historyitem{padding:12px 0;border-bottom:1px solid #30383f}.historyitem:last-child{border:0}.hidden{display:none!important}select{background:#242b31;color:#f5f5f2;border:1px solid #455159;border-radius:10px;padding:10px;max-width:100%}a{color:#b5f0c7}.subheading{margin:0 0 8px;font-size:15px}footer{font-size:11px;color:#7e8a8f;margin:20px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b5f0c7}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#b5f0c7;color:#12251b;padding:11px 16px;border-radius:12px;font-size:13px;display:none;z-index:99;max-width:90%;text-align:center}
</style></head><body><div class="app"><header class="top"><div class="brand">PROTOONE <span style="color:#b5f0c7">/ 2.0</span></div><div class="mark">P1</div></header><main id="main"></main><footer>Personal prototype · Local device storage · Export backups regularly</footer></div><nav class="nav"><div class="navinner" id="nav"></div></nav><div id="toast"></div><input type="file" id="importFile" accept="application/json" class="hidden"><script>
const EX={rdl:{name:'Dumbbell Romanian Deadlift',type:'Strength · Hinge',reps:'8–10',cue:'Hinge at the hips with a neutral spine. Keep dumbbells close and stop before your back position changes.',sets:3},press:{name:'Incline Dumbbell Press',type:'Strength · Push',reps:'8–12',cue:'Set the bench at a moderate incline. Keep shoulders stable and press with control.',sets:3},row:{name:'Seated Cable Row',type:'Strength · Pull',reps:'10–12',cue:'Stay tall, initiate through the back and avoid leaning excessively.',sets:3},step:{name:'Dumbbell Step-Up',type:'Functional · Single leg',reps:'6 / leg',cue:'Use a stable step. Drive through the leading leg and control the descent.',sets:2},carry:{name:"Farmer's Carry",type:'Functional · Carry',reps:'20–30 m',cue:'Walk tall with even steps. Avoid leaning and keep loads manageable.',sets:2},pallof:{name:'Pallof Press',type:'Core · Anti-rotation',reps:'8 / side',cue:'Brace gently and press forward without rotating your torso.',sets:2},pushup:{name:'Incline Push-Up',type:'Tactical · Push',reps:'5–8',cue:'Choose a bench height that allows clean repetitions with 2–3 reps left in reserve.',sets:2},lunge:{name:'Reverse Lunge',type:'Tactical · Single leg',reps:'6 / leg',cue:'Step back with control. Keep balance and avoid rushing.',sets:2},deadbug:{name:'Dead Bug',type:'Core · Control',reps:'6 / side',cue:'Keep ribs down and move slowly without arching the lower back.',sets:2},goblet:{name:'Goblet Squat',type:'Strength · Squat',reps:'8–10',cue:'Hold weight close, brace and squat to a comfortable depth.',sets:3},pull:{name:'Assisted Pull-Up',type:'Tactical · Pull',reps:'4–6',cue:'Choose enough assistance to keep each rep controlled. No need to reach failure.',sets:2},kb:{name:'Kettlebell Deadlift',type:'Strength · Hinge',reps:'10–12',cue:'Hinge with control and stand tall. Avoid rounding the lower back.',sets:3},ring:{name:'Ring Row',type:'Tactical · Pull',reps:'6–10',cue:'Set your foot position so the final rep is challenging but controlled.',sets:3},floor:{name:'Floor Push-Up',type:'Tactical · Push',reps:'5–10',cue:'Maintain a straight line from head to heels. Elevate hands if needed.',sets:3},split:{name:'Bodyweight Split Squat',type:'Functional · Single leg',reps:'8 / leg',cue:'Use a comfortable stance and lower with control.',sets:2},plank:{name:'Side Plank',type:'Core · Stability',reps:'20 sec / side',cue:'Keep hips stacked and breathe throughout.',sets:2},ohp:{name:'Dumbbell Shoulder Press',type:'Strength · Push',reps:'8–10',cue:'Brace and press without leaning back.',sets:3},lat:{name:'Lat Pulldown',type:'Strength · Pull',reps:'8–12',cue:'Pull elbows toward your sides with controlled motion.',sets:3},squat:{name:'Bodyweight Squat',type:'Tactical · Squat',reps:'10–12',cue:'Move smoothly at a pace that allows easy breathing.',sets:2},march:{name:'Loaded March',type:'Functional · Carry',reps:'40 sec',cue:'Maintain tall posture with controlled marching steps.',sets:2},bench:{name:'Dumbbell Bench Press',type:'Strength · Push',reps:'8–10',cue:'Lower under control and maintain stable shoulders.',sets:3},dbrow:{name:'One-Arm Dumbbell Row',type:'Strength · Pull',reps:'10 / side',cue:'Brace with free hand and avoid rotating the torso.',sets:3},hinge:{name:'Bodyweight Hip Hinge',type:'Movement · Hinge',reps:'12',cue:'Push hips back and keep a neutral spine.',sets:2}};
const TEMPLATES={strength:{name:'Strength Hybrid',desc:'Muscle-focused strength rotations with controlled tactical complements.',gym:['goblet','press','deadbug','row','lunge','carry'],home:['kb','floor','deadbug','ring','split','march']},functional:{name:'Functional Hybrid',desc:'Full-body strength, unilateral control, carries and scaled calisthenics.',gym:['rdl','pushup','pallof','row','step','carry'],home:['kb','floor','plank','ring','split','march']},tactical:{name:'Tactical Hybrid',desc:'Scalable bodyweight work and functional strength without arbitrary AMRAP targets.',gym:['bench','squat','deadbug','lat','lunge','march'],home:['floor','squat','deadbug','ring','split','march']}};
const KEY='protoone2_personal_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{history:[]}}catch{db={history:[]}};db.history||=[];let ui={tab:'home',location:'work',minutes:45,energy:'normal',plan:null,index:0,sets:{},started:null};const $=s=>document.querySelector(s);function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage unavailable. Export your data regularly.')}}function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function pick(k,v){ui[k]=v;render()}function recommended(){let last=db.history[0]?.template;let seq=['strength','functional','tactical'];return seq[(seq.indexOf(last)+1)%3]||'strength'}function exerciseList(type,loc,mins){let ids=TEMPLATES[type][loc==='home'?'home':'gym'];return mins===20?ids.slice(0,3):mins===30?ids.slice(0,4):ids}function createPlan(type){let ids=exerciseList(type,ui.location,ui.minutes);ui.plan={type,ids,location:ui.location,minutes:ui.minutes,energy:ui.energy};ui.index=0;ui.sets={};ui.started=new Date().toISOString();ui.tab='workout';render()}function renderNav(){let tabs=[['home','⌂','Home'],['workout','▣','Workout'],['library','◫','Library'],['history','↗','History']];$('#nav').innerHTML=tabs.map(([id,ico,name])=>`<button class="${ui.tab===id?'active':''}" onclick="pick('tab','${id}')"><b>${ico}</b>${name}</button>`).join('')}function visual(id){let type=EX[id].type;let clr=type.includes('Strength')?'#b5f0c7':type.includes('Tactical')?'#e5c89a':'#8cc4df';return `<div class="visual"><svg viewBox="0 0 100 100" role="img" aria-label="Stylized exercise illustration"><circle cx="50" cy="18" r="10" fill="${clr}"/><path d="M50 31 L50 62 M50 39 L27 51 M50 39 L74 48 M50 62 L33 88 M50 62 L69 88" stroke="${clr}" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M13 51h14m47-3h13" stroke="${clr}" stroke-width="5" stroke-linecap="round"/></svg></div>`}function exCard(id,i){return `<div class="exercise">${visual(id)}<div class="info"><strong>${EX[id].name}</strong><span>${EX[id].type}<br>${EX[id].sets} sets · ${EX[id].reps}</span></div><span class="pill">${i+1}</span></div>`}function home(){let rec=recommended(),name=TEMPLATES[rec].name;return `<h1>Ready to train?</h1><p>Strength that lasts. Movement that matters.</p><div class="hero"><span class="tag">NEXT RECOMMENDED</span><h2>${name}</h2><p>${TEMPLATES[rec].desc}</p></div><div class="stats"><div class="stat"><span class="label">Sessions</span><strong>${db.history.length}</strong></div><div class="stat"><span class="label">Last</span><strong style="font-size:14px">${db.history.length?new Date(db.history[0].date).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}</strong></div><div class="stat"><span class="label">Goal</span><strong style="font-size:15px">Consistency</strong></div></div><section class="section panel"><h2>Session setup</h2><div class="label">Location</div><div class="seg">${[['home','Home'],['work','Work gym'],['gym','Gym']].map(([v,l])=>`<button class="${ui.location===v?'active':''}" onclick="pick('location','${v}')">${l}</button>`).join('')}</div><div class="label" style="margin-top:18px">Time available</div><div class="seg four">${[20,30,45,60].map(v=>`<button class="${ui.minutes===v?'active':''}" onclick="pick('minutes',${v})">${v} min</button>`).join('')}</div><div class="label" style="margin-top:18px">Readiness</div><div class="seg">${[['tired','Low'],['normal','Normal'],['strong','Strong']].map(([v,l])=>`<button class="${ui.energy===v?'active':''}" onclick="pick('energy','${v}')">${l}</button>`).join('')}</div><button class="primary" onclick="createPlan('${rec}')">Start recommended workout →</button><div class="label" style="margin-top:18px">Or choose a focus</div><div class="toolbar" style="margin-top:10px">${Object.keys(TEMPLATES).map(k=>`<button class="secondary" onclick="createPlan('${k}')">${TEMPLATES[k].name.replace(' Hybrid','')}</button>`).join('')}</div></section><p class="small">Recommendations currently rotate the three workout types using your most recent completed session. Advanced fatigue and progression logic is not yet implemented.</p>`}function workout(){if(!ui.plan)return `<h1>Active workout</h1><div class="empty">No session started yet.<br><br><button class="primary" onclick="pick('tab','home')">Choose today's workout</button></div>`;let id=ui.plan.ids[ui.index],ex=EX[id],num=ui.energy==='tired'?Math.max(1,ex.sets-1):ex.sets,entries=ui.sets[id]||[];return `<div class="row" style="margin-top:25px"><span class="label">${TEMPLATES[ui.plan.type].name}</span><span class="label">${ui.index+1} / ${ui.plan.ids.length}</span></div><h1>${ex.name}</h1><div class="row"><span class="muted small">${ex.type}</span><span class="pill">${ex.reps}</span></div><div class="hero" style="min-height:175px;display:grid;place-items:center">${visual(id).replace('class="visual"','class="visual" style="height:145px;width:170px;background:transparent"').replace('height="70px" width="70px"','height="130px" width="130px"')}</div><div class="help"><strong>Technique cue:</strong> ${ex.cue}</div><section class="section panel"><div class="row"><h2 style="margin:0">Log your sets</h2><span class="small muted">${num} sets</span></div><div class="set small muted" style="margin-top:14px"><span>#</span><span style="text-align:center">Weight (lb)</span><span style="text-align:center">Reps / result</span><span style="text-align:center">Done</span></div>${Array.from({length:num},(_,i)=>{let e=entries[i]||{};return `<div class="set"><span>${i+1}</span><input aria-label="Set ${i+1} weight" inputmode="decimal" placeholder="—" value="${escapeHTML(e.weight||'')}" onchange="updateSet('${id}',${i},'weight',this.value)"><input aria-label="Set ${i+1} reps" placeholder="${ex.reps}" value="${escapeHTML(e.reps||'')}" onchange="updateSet('${id}',${i},'reps',this.value)"><button class="${e.done?'done':''}" onclick="toggleSet('${id}',${i})">${e.done?'✓':'○'}</button></div>`}).join('')}<p class="small" style="margin:12px 0 0">For carries and timed exercises, enter distance or seconds in the reps/result field. Leave weight blank for bodyweight work.</p></section><div class="toolbar"><button class="secondary" onclick="navigate(-1)" ${ui.index===0?'disabled':''}>← Previous</button><button class="secondary" onclick="navigate(1)" ${ui.index===ui.plan.ids.length-1?'disabled':''}>Next →</button></div><button class="primary" onclick="finish()">Finish & save session</button><p class="small" style="margin-top:12px">This first prototype uses a guided exercise list. Timed rotations and demonstration videos are planned for later iterations.</p>`}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateSet(id,i,k,v){ui.sets[id]??=[];ui.sets[id][i]??={};ui.sets[id][i][k]=v}function toggleSet(id,i){ui.sets[id]??=[];ui.sets[id][i]??={};ui.sets[id][i].done=!ui.sets[id][i].done;render()}function navigate(n){ui.index=Math.max(0,Math.min(ui.plan.ids.length-1,ui.index+n));render();window.scrollTo(0,0)}function finish(){if(!confirm('Finish and save this workout?'))return;db.history.unshift({date:new Date().toISOString(),template:ui.plan.type,location:ui.plan.location,minutes:ui.plan.minutes,energy:ui.plan.energy,ids:ui.plan.ids,sets:ui.sets});persist();ui.plan=null;ui.tab='history';render();toast('Workout saved on this device')}function library(){return `<h1>Exercise library</h1><p>${Object.keys(EX).length} starter movements. Each includes a technique cue and prescribed repetitions.</p><div class="panel">${Object.keys(EX).map((id,i)=>exCard(id,i)).join('')}</div><p class="small">Exercise illustrations are placeholders. Licensed or original photographs and videos can replace them in a future version.</p>`}function history(){return `<h1>Performance history</h1><p>Your completed workouts are stored locally in this browser on this device.</p><div class="stats"><div class="stat"><span class="label">Sessions</span><strong>${db.history.length}</strong></div><div class="stat"><span class="label">Work</span><strong>${db.history.filter(x=>x.location==='work').length}</strong></div><div class="stat"><span class="label">Home</span><strong>${db.history.filter(x=>x.location==='home').length}</strong></div></div><div class="panel">${db.history.length?db.history.map((h,i)=>`<div class="historyitem"><div class="row"><strong>${TEMPLATES[h.template]?.name||h.template}</strong><span class="small muted">${new Date(h.date).toLocaleDateString()}</span></div><p class="small" style="margin:5px 0">${h.location==='home'?'Home':h.location==='work'?'Work Gym':'Commercial Gym'} · ${h.minutes} min · ${h.ids.length} movements</p><details><summary class="small" style="color:#b5f0c7;cursor:pointer">View recorded sets</summary><div style="margin-top:10px">${h.ids.map(id=>`<div class="small" style="padding:5px 0"><strong>${EX[id]?.name||id}</strong><br>${(h.sets[id]||[]).map((s,j)=>`Set ${j+1}: ${escapeHTML(s.weight||'BW')} / ${escapeHTML(s.reps||'—')}${s.done?' ✓':''}`).join(' · ')||'No sets recorded'}</div>`).join('')}</div></details></div>`).join(''):'<div class="empty">No saved sessions yet. Complete your first workout to start tracking.</div>'}</div><div class="toolbar"><button class="secondary" onclick="exportData()">Export backup ↓</button><button class="secondary" onclick="$('#importFile').click()">Import backup ↑</button></div><p class="small" style="margin-top:16px">Important: iPhone browser storage can be cleared or isolated between apps. Export your backup after sessions until we establish more durable storage.</p>`}function exportData(){let blob=new Blob([JSON.stringify({app:'protoone2',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='protoone-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='protoone2'||!Array.isArray(d.data?.history))throw Error('Invalid backup');if(!confirm('Replace current history with this backup?'))return;db=d.data;persist();render();toast('Backup imported')}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''});function render(){renderNav();$('#main').innerHTML=ui.tab==='home'?home():ui.tab==='workout'?workout():ui.tab==='library'?library():history()}render();</script></body></html>
