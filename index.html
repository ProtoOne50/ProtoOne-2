const EX={rdl:{name:'Dumbbell Romanian Deadlift',type:'Strength · Hinge',reps:'8–10',cue:'Hinge at the hips with a neutral spine. Keep dumbbells close and stop before your back position changes.',sets:3},press:{name:'Incline Dumbbell Press',type:'Strength · Push',reps:'8–12',cue:'Set the bench at a moderate incline. Keep shoulders stable and press with control.',sets:3},row:{name:'Seated Cable Row',type:'Strength · Pull',reps:'10–12',cue:'Stay tall, initiate through the back and avoid leaning excessively.',sets:3},step:{name:'Dumbbell Step-Up',type:'Functional · Single leg',reps:'6 / leg',cue:'Use a stable step. Drive through the leading leg and control the descent.',sets:2},carry:{name:"Farmer's Carry",type:'Functional · Carry',reps:'20–30 m',cue:'Walk tall with even steps. Avoid leaning and keep loads manageable.',sets:2},pallof:{name:'Pallof Press',type:'Core · Anti-rotation',reps:'8 / side',cue:'Brace gently and press forward without rotating your torso.',sets:2},pushup:{name:'Incline Push-Up',type:'Tactical · Push',reps:'5–8',cue:'Choose a bench height that allows clean repetitions with 2–3 reps left in reserve.',sets:2},lunge:{name:'Reverse Lunge',type:'Tactical · Single leg',reps:'6 / leg',cue:'Step back with control. Keep balance and avoid rushing.',sets:2},deadbug:{name:'Dead Bug',type:'Core · Control',reps:'6 / side',cue:'Keep ribs down and move slowly without arching the lower back.',sets:2},goblet:{name:'Goblet Squat',type:'Strength · Squat',reps:'8–10',cue:'Hold weight close, brace and squat to a comfortable depth.',sets:3},pull:{name:'Assisted Pull-Up',type:'Tactical · Pull',reps:'4–6',cue:'Choose enough assistance to keep each rep controlled. No need to reach failure.',sets:2},kb:{name:'Kettlebell Deadlift',type:'Strength · Hinge',reps:'10–12',cue:'Hinge with control and stand tall. Avoid rounding the lower back.',sets:3},ring:{name:'Ring Row',type:'Tactical · Pull',reps:'6–10',cue:'Set your foot position so the final rep is challenging but controlled.',sets:3},floor:{name:'Floor Push-Up',type:'Tactical · Push',reps:'5–10',cue:'Maintain a straight line from head to heels. Elevate hands if needed.',sets:3},split:{name:'Bodyweight Split Squat',type:'Functional · Single leg',reps:'8 / leg',cue:'Use a comfortable stance and lower with control.',sets:2},plank:{name:'Side Plank',type:'Core · Stability',reps:'20 sec / side',cue:'Keep hips stacked and breathe throughout.',sets:2},ohp:{name:'Dumbbell Shoulder Press',type:'Strength · Push',reps:'8–10',cue:'Brace and press without leaning back.',sets:3},lat:{name:'Lat Pulldown',type:'Strength · Pull',reps:'8–12',cue:'Pull elbows toward your sides with controlled motion.',sets:3},squat:{name:'Bodyweight Squat',type:'Tactical · Squat',reps:'10–12',cue:'Move smoothly at a pace that allows easy breathing.',sets:2},march:{name:'Loaded March',type:'Functional · Carry',reps:'40 sec',cue:'Maintain tall posture with controlled marching steps.',sets:2},bench:{name:'Dumbbell Bench Press',type:'Strength · Push',reps:'8–10',cue:'Lower under control and maintain stable shoulders.',sets:3},dbrow:{name:'One-Arm Dumbbell Row',type:'Strength · Pull',reps:'10 / side',cue:'Brace with free hand and avoid rotating the torso.',sets:3},hinge:{name:'Bodyweight Hip Hinge',type:'Movement · Hinge',reps:'12',cue:'Push hips back and keep a neutral spine.',sets:2}};

function visual(id){

let poses={

move:{head:[102,36],body:'M102 53 L102 113',arms:'M102 70 L70 97 M102 70 L133 97',legs:'M102 113 L78 153 M102 113 L128 153',gear:''}};
let a=poses[family];return `<div class="visual" role="img" aria-label="${EX[id].name}: simplified movement illustration"><svg viewBox="0 0 210 190" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="bg-${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294149"/><stop offset="1" stop-color="#111d23"/></linearGradient></defs><rect width="210" height="190" fill="url(#bg-${id})"/><path d="M18 166 H193" stroke="#536a6a" stroke-width="2"/><circle cx="${a.head[0]}" cy="${a.head[1]}" r="13" fill="${accent}"/><path d="${a.body}" fill="none" stroke="${accent}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="${a.arms} ${a.legs}" fill="none" stroke="${accent}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>${a.gear}<rect x="9" y="9" width="68" height="19" rx="9" fill="#0b1519" opacity=".8"/><text x="43" y="22" fill="#b5f0c7" font-size="10" text-anchor="middle" font-weight="bold">${family.toUpperCase()}</text></svg></div>`}
function exCard(id,i){return `<div class="exercise">${visual(id)}<div class="info"><strong>${EX[id].name}</strong><span>${EX[id].type}<br>${EX[id].sets} sets · ${EX[id].reps}</span></div><span class="pill">${i+1}</span></div>`}function home(){let rec=recommended(),name=TEMPLATES[rec].name;return `<div class="photo-hero" style="background-image:linear-gradient(0deg,#0b1017 2%,transparent 75%),url('${athletePhoto()}')"><div class="photo-title"><span class="label" style="color:#b5f0c7">TODAY’S ATHLETE · ROTATES DAILY</span><h1>Ready to train?</h1><p>Strength that lasts. Movement that matters.</p></div></div><div class="hero"><span class="tag">NEXT RECOMMENDED</span><h2>${name}</h2><p>${TEMPLATES[rec].desc}</p></div><div class="model-strip"><span class="label">Your rotating athletes</span><div class="portrait-row">${ATHLETE_PORTRAITS.map((src,i)=>`<img src="${src}" alt="Female fitness athlete ${i+1}" style="${i===athleteIndex()?'outline:2px solid #b5f0c7':''}">`).join('')}</div></div><div class="stats"><div class="stat"><span class="label">Sessions</span><strong>${db.history.length}</strong></div><div class="stat"><span class="label">Last</span><strong style="font-size:14px">${db.history.length?new Date(db.history[0].date).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}</strong></div><div class="stat"><span class="label">Goal</span><strong style="font-size:15px">Consistency</strong></div></div><section class="section panel"><h2>Session setup</h2><div class="label">Location</div><div class="seg">${[['home','Home'],['work','Work gym'],['gym','Gym']].map(([v,l])=>`<button class="${ui.location===v?'active':''}" onclick="pick('location','${v}')">${l}</button>`).join('')}</div><div class="label" style="margin-top:18px">Time available</div><div class="seg four">${[20,30,45,60].map(v=>`<button class="${ui.minutes===v?'active':''}" onclick="pick('minutes',${v})">${v} min</button>`).join('')}</div><div class="label" style="margin-top:18px">Readiness</div><div class="seg">${[['tired','Low'],['normal','Normal'],['strong','Strong']].map(([v,l])=>`<button class="${ui.energy===v?'active':''}" onclick="pick('energy','${v}')">${l}</button>`).join('')}</div><button class="primary" onclick="createPlan('${rec}')">Start recommended workout →</button><div class="label" style="margin-top:18px">Or choose a focus</div><div class="toolbar" style="margin-top:10px">${Object.keys(TEMPLATES).map(k=>`<button class="secondary" onclick="createPlan('${k}')">${TEMPLATES[k].name.replace(' Hybrid','')}</button>`).join('')}</div></section><p class="small">Recommendations currently rotate the three workout types using your most recent completed session. Advanced fatigue and progression logic is not yet implemented.</p>`}function workout(){if(!ui.plan)return `<h1>Active workout</h1><div class="empty">No session started yet.<br><br><button class="primary" onclick="pick('tab','home')">Choose today's workout</button></div>`;if(ui.overview){let ids=ui.plan.ids;return `<h1>${TEMPLATES[ui.plan.type].name}</h1><p>${ui.plan.minutes} min · ${ui.plan.location==='work'?'Work gym':ui.plan.location==='home'?'Home':'Gym'} · ${ui.plan.energy} readiness</p><div class="athlete-banner"><img src="${athletePhoto(1)}" alt="Athletic female portrait, visual inspiration only"><div><span class="label">Today’s training partner</span><strong>Show up. Move well. Get stronger.</strong><small>Portrait changes daily</small></div></div><div class="notice">Alternate through each three-movement rotation. Complete one set of A1, A2 and A3, then repeat. Rest as needed to preserve good strength performance.</div>${[0,3].filter(i=>i<ids.length).map((start,j)=>`<div class="rotation"><span class="label">Rotation ${j+1} · ${j===0?'Strength + control':'Pull + movement'}</span><div class="session-list" style="margin-top:10px">${ids.slice(start,start+3).map((id,i)=>`<button onclick="openExercise(${start+i})">${visual(id)}<span><strong>${EX[id].name}</strong><small>${EX[id].sets} sets · ${EX[id].reps}</small></span><span class="count">→</span></button>`).join('')}</div></div>`).join('')}<button class="primary" onclick="openExercise(0)">Begin guided workout →</button><button class="secondary" style="width:100%;margin-top:10px" onclick="ui.plan=null;ui.tab='home';render()">Change workout</button>`};let id=ui.plan.ids[ui.index],ex=EX[id],num=ui.energy==='tired'?Math.max(1,ex.sets-1):ex.sets,entries=ui.sets[id]||[];return `<div class="row" style="margin-top:25px"><span class="label">${TEMPLATES[ui.plan.type].name}</span><span class="label">${ui.index+1} / ${ui.plan.ids.length}</span></div><h1>${ex.name}</h1><div class="row"><span class="muted small">${ex.type}</span><span class="pill">${ex.reps}</span></div><div class="athlete-banner"><img src="${athletePhoto(2)}" alt="Female athlete portrait, not an exercise demonstration"><div><span class="label">Movement focus</span><strong>${ex.name}</strong><small>Technique illustration below</small></div></div><div>${visual(id).replace('class="visual"','class="exercise-visual"')}</div><div class="help"><strong>Technique cue:</strong> ${ex.cue}</div><section class="section panel"><div class="row"><h2 style="margin:0">Log your sets</h2><span class="small muted">${num} sets</span></div><div class="set small muted" style="margin-top:14px"><span>#</span><span style="text-align:center">Weight (lb)</span><span style="text-align:center">Reps / result</span><span style="text-align:center">Done</span></div>${Array.from({length:num},(_,i)=>{let e=entries[i]||{};return `<div class="set"><span>${i+1}</span><input aria-label="Set ${i+1} weight" inputmode="decimal" placeholder="—" value="${escapeHTML(e.weight||'')}" onchange="updateSet('${id}',${i},'weight',this.value)"><input aria-label="Set ${i+1} reps" placeholder="${ex.reps}" value="${escapeHTML(e.reps||'')}" onchange="updateSet('${id}',${i},'reps',this.value)"><button class="${e.done?'done':''}" onclick="toggleSet('${id}',${i})">${e.done?'✓':'○'}</button></div>`}).join('')}<p class="small" style="margin:12px 0 0">For carries and timed exercises, enter distance or seconds in the reps/result field. Leave weight blank for bodyweight work.</p></section><div class="toolbar"><button class="secondary" onclick="navigate(-1)" ${ui.index===0?'disabled':''}>← Previous</button><button class="secondary" onclick="navigate(1)" ${ui.index===ui.plan.ids.length-1?'disabled':''}>Next →</button></div><button class="primary" onclick="finish()">Review & save session</button><p class="small" style="margin-top:12px">Version 2.2 features six rotating female athlete portraits. Portraits are decorative, while movement diagrams and cues provide exercise guidance. Verified demonstration videos are not yet included.</p>`}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateSet(id,i,k,v){ui.sets[id]??=[];ui.sets[id][i]??={};ui.sets[id][i][k]=v}function toggleSet(id,i){ui.sets[id]??=[];ui.sets[id][i]??={};ui.sets[id][i].done=!ui.sets[id][i].done;render()}function openExercise(i){ui.overview=false;ui.index=i;render();window.scrollTo(0,0)}function navigate(n){ui.index=Math.max(0,Math.min(ui.plan.ids.length-1,ui.index+n));render();window.scrollTo(0,0)}function finish(){let done=Object.values(ui.sets).flat().filter(x=>x.done).length;let all=ui.plan.ids.reduce((n,id)=>n+(ui.energy==='tired'?Math.max(1,EX[id].sets-1):EX[id].sets),0);if(!confirm(`Review session: ${done} of ${all} sets marked complete. Save this workout now?`))return;db.history.unshift({date:new Date().toISOString(),template:ui.plan.type,location:ui.plan.location,minutes:ui.plan.minutes,energy:ui.plan.energy,ids:ui.plan.ids,sets:ui.sets});persist();ui.plan=null;ui.overview=false;ui.tab='history';render();toast('Workout saved on this device')}function library(){return `<h1>Exercise library</h1><p>${Object.keys(EX).length} starter movements. Each includes a technique cue and prescribed repetitions.</p><div class="panel">${Object.keys(EX).map((id,i)=>exCard(id,i)).join('')}</div><p class="small">Original diagrams are simplified movement references, not verified technique demonstrations. Female athlete portraits are decorative.</p>`}function history(){return `<h1>Performance history</h1><p>Your completed workouts are stored locally in this browser on this device.</p><div class="stats"><div class="stat"><span class="label">Sessions</span><strong>${db.history.length}</strong></div><div class="stat"><span class="label">Work</span><strong>${db.history.filter(x=>x.location==='work').length}</strong></div><div class="stat"><span class="label">Home</span><strong>${db.history.filter(x=>x.location==='home').length}</strong></div></div><div class="panel">${db.history.length?db.history.map((h,i)=>`<div class="historyitem"><div class="row"><strong>${TEMPLATES[h.template]?.name||h.template}</strong><span class="small muted">${new Date(h.date).toLocaleDateString()}</span></div><p class="small" style="margin:5px 0">${h.location==='home'?'Home':h.location==='work'?'Work Gym':'Commercial Gym'} · ${h.minutes} min · ${h.ids.length} movements</p><details><summary class="small" style="color:#b5f0c7;cursor:pointer">View recorded sets</summary><div style="margin-top:10px">${h.ids.map(id=>`<div class="small" style="padding:5px 0"><strong>${EX[id]?.name||id}</strong><br>${(h.sets[id]||[]).map((s,j)=>`Set ${j+1}: ${escapeHTML(s.weight||'BW')} / ${escapeHTML(s.reps||'—')}${s.done?' ✓':''}`).join(' · ')||'No sets recorded'}</div>`).join('')}</div></details></div>`).join(''):'<div class="empty">No saved sessions yet. Complete your first workout to start tracking.</div>'}</div><div class="toolbar"><button class="secondary" onclick="exportData()">Export backup ↓</button><button class="secondary" onclick="$('#importFile').click()">Import backup ↑</button></div><p class="small" style="margin-top:16px">Important: iPhone browser storage can be cleared or isolated between apps. Export your backup after sessions until we establish more durable storage.</p>`}function exportData(){let blob=new Blob([JSON.stringify({app:'protoone2',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='protoone-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='protoone2'||!Array.isArray(d.data?.history))throw Error('Invalid backup');if(!confirm('Replace current history with this backup?'))return;db=d.data;persist();render();toast('Backup imported')}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''});function render(){renderNav();$('#main').innerHTML=ui.tab==='home'?home():ui.tab==='workout'?workout():ui.tab==='library'?library():history()}render();</script></body></html>
